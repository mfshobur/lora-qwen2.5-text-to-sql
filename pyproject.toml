[project]
name = "nl2sql-lora"
version = "0.1.0"
description = "Fine-tuning Qwen2.5-0.5B with LoRA for natural-language-to-SQL on PostgreSQL"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Muh. Shobur Fattah", email = "mfshobur@gmail.com" },
]
license = "MIT"
dependencies = [
    "datasets>=4.8.5",
    "faker>=38.0.0",
    "huggingface-hub>=0.36.0",
    "matplotlib>=3.10.9",
    "openai>=2.9.0",
    "peft>=0.19.1",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "sqlglot>=30.8.0",
    "torch>=2.12.0",
    "transformers>=5.8.1",
    "trl>=1.4.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.30.0",
    "ipywidgets>=8.1.0",
]
